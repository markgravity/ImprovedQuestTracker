# Release: on every version tag (v1.0.0, v1.1.0-beta1...), build the zip,
# create the GitHub release with this version's notes from CHANGELOG.md and,
# when the CF_API_KEY secret is set, upload the file to CurseForge.
#
# CurseForge also needs '## X-Curse-Project-ID' in the TOC. Optional repository
# variables: CF_GAME_VERSION (default 1.60.1, WoW Forever) or CF_GAME_VERSION_ID,
# both comma-separated lists (e.g. "1.60.1,5.5.3" to add MoP Classic).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
      CF_GAME_VERSION_ID: ${{ vars.CF_GAME_VERSION_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the version
        run: python tools/release.py check "$GITHUB_REF_NAME"

      - name: Build the zip
        run: |
          python tools/package.py
          python tools/release.py notes > dist/notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$(python tools/release.py title) $version" --notes-file dist/notes.md $prerelease

      - name: CurseForge
        if: env.CF_API_KEY != ''
        run: python tools/release.py curseforge
